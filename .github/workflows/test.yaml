# rstream retains the complete Linux race, benchmark and coverage evidence
# as artifacts in this fork instead of uploading to the upstream Codecov project.
name: Test
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        go: ["1.24", "1.25", "1.27"] # auto-update/supported-go-version-list
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Race, benchmarks and cross-package coverage
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/.ci.conf ]; then . .github/.ci.conf; fi
          if [ -n "${PRE_TEST_HOOK:-}" ]; then ${PRE_TEST_HOOK}; fi
          go test -coverpkg=./... -coverprofile=cover.out -bench=. -v -race ./... 2>&1 | tee test.log
          if [ -n "${POST_TEST_HOOK:-}" ]; then ${POST_TEST_HOOK}; fi
          go tool cover -func=cover.out > coverage-summary.txt
          tail -n 1 coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve test and coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-coverage-go-${{ matrix.go }}
          path: |
            test.log
            cover.out
            coverage-summary.txt
          if-no-files-found: error
          retention-days: 90

  test-i386:
    uses: pion/.goassets/.github/workflows/test-i386.reusable.yml@main
    strategy:
      matrix:
        go: ["1.25", "1.24"] # auto-update/supported-go-version-list
      fail-fast: false
    with:
      go-version: ${{ matrix.go }}

  test-windows:
    uses: pion/.goassets/.github/workflows/test-windows.reusable.yml@main
    strategy:
      matrix:
        go: ["1.25", "1.24"] # auto-update/supported-go-version-list
      fail-fast: false
    with:
      go-version: ${{ matrix.go }}

  test-macos:
    uses: pion/.goassets/.github/workflows/test-macos.reusable.yml@main
    strategy:
      matrix:
        go: ["1.25", "1.24"] # auto-update/supported-go-version-list
      fail-fast: false
    with:
      go-version: ${{ matrix.go }}

  test-wasm:
    uses: pion/.goassets/.github/workflows/test-wasm.reusable.yml@main
    with:
      go-version: "1.25" # auto-update/latest-go-version
    secrets: inherit
